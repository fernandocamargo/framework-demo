name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The types (tsc, and the framework's checker with its convention checks), the unit tests
      # and a build.
      - run: npm run check

      # The main flows, in the production build, on the memory client: no network.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      # The build GitHub Pages serves, under the repository's name, whatever that is.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
